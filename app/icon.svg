<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GratisCode logo</title>
  <desc id="desc">A terminal-style greater-than prompt followed by Gr.</desc>
  <rect width="96" height="96" rx="22" fill="#0a0a0a"/>
  <rect x="1" y="1" width="94" height="94" rx="21" stroke="#2a2a2a" stroke-width="2"/>
  <text x="48" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="800" letter-spacing="-2">
    <tspan fill="#a3a3a3">&gt;</tspan><tspan fill="#f5f5f5">Gr</tspan>
  </text>
</svg>
